<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">LG Smart TV Remote</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a50034'><path d='M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12zm-5-7v2h3v-2h-3zm-6.5-1L7 6.5 4.5 9l2.5 2.5L9.5 9 12 11.5 14.5 9 12 6.5 9.5 9z'/></svg>">
    
    <style>
        :root {
            --bg-color: #121212; --card-bg: #1e1e1e; --accent-color: #a50034;
            --btn-bg: #2d2d2d; --text-color: #ffffff;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-color); color: var(--text-color); 
            margin: 0; padding: 20px; display: flex; flex-direction: column; 
            align-items: center; padding-bottom: 200px; 
        }

        /* HEADER */
        .app-header {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 25px; width: 100%; max-width: 1200px;
        }
        .app-header svg { width: 36px; height: 36px; stroke: var(--accent-color); }
        .app-header h1 { margin: 0; font-size: 22px; font-weight: 600; }

        /* MASONRY LAYOUT (CSS COLUMNS) */
        .container { 
            width: 100%; max-width: 1200px; 
            column-count: 1; column-gap: 20px;
        }
        
        @media (min-width: 700px) { .container { column-count: 2; } }
        @media (min-width: 1050px) { .container { column-count: 3; } }

        .card { 
            background-color: var(--card-bg); padding: 18px; border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
            margin-bottom: 20px; display: inline-block; width: 100%; box-sizing: border-box;
            break-inside: avoid; page-break-inside: avoid; /* Impede o cartão de quebrar no meio */
        }
        
        h3 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 16px; color: #ccc; }

        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #444; background-color: #000; color: #fff; font-size: 16px; box-sizing: border-box; }
        button { background-color: var(--btn-bg); color: var(--text-color); border: none; padding: 12px 5px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.15s; }
        button:active { transform: scale(0.95); background-color: #444; }

        .action-btn { background-color: var(--accent-color); width: 100%; margin-bottom: 5px; padding: 14px; font-size: 14px; }
        .action-btn:active { background-color: #d32f2f; }

        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        
        .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .dpad button { height: 65px; font-size: 18px; }

        .vol-ch-container { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 15px; }
        .column-btn { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .column-btn button { height: 50px; font-size: 15px; }

        .btn-red { border-bottom: 4px solid #f44336; height: 40px; }
        .btn-green { border-bottom: 4px solid #4caf50; height: 40px; }
        .btn-yellow { border-bottom: 4px solid #ffeb3b; height: 40px; }
        .btn-blue { border-bottom: 4px solid #2196f3; height: 40px; }

        /* TOASTS & CONSOLE */
        #toast {
            visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center;
            border-radius: 8px; padding: 16px; position: fixed; z-index: 1000; left: 50%; bottom: 30px;
            font-size: 14px; transform: translateX(-50%); box-shadow: 0px 4px 12px rgba(0,0,0,0.5);
            transition: visibility 0s, opacity 0.3s linear; opacity: 0;
        }
        #toast.show { visibility: visible; opacity: 1; }
        #toast.error { background-color: #d32f2f; }
        #toast.success { background-color: #4caf50; }

        #debug-console {
            width: 100%; max-width: 1200px; height: 150px; background-color: #000; border-top: 2px solid #444;
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            overflow-y: auto; font-family: monospace; font-size: 11px; padding: 10px; box-sizing: border-box;
            color: #0f0; z-index: 900; display: none;
        }
        .log-entry { margin-bottom: 4px; border-bottom: 1px dashed #333; padding-bottom: 2px; }
        .log-error { color: #ff5555; }
        .log-warn { color: #ffb86c; }
        
        #toggleDebug {
            position: fixed; bottom: 10px; right: 10px; background: #444; font-size: 10px;
            padding: 8px 12px; border-radius: 6px; z-index: 901; opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="app-header">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
        <path d="M17 2l-5 5-5-5"></path>
        <path d="M12 18h.01"></path>
    </svg>
    <h1 data-i18n="page_title">LG Smart TV Remote</h1>
</div>

<div class="container">
    <div class="card">
        <h3 data-i18n="conn_title">1. Connection</h3>
        <input type="text" id="tvIp" value="" data-i18n="ip_placeholder" placeholder="TV Address" autocapitalize="none" autocorrect="off" spellcheck="false">
        
        <div id="auth-step-1">
            <button class="action-btn" data-i18n="btn_req_pin" onclick="requestPin()">1. Request PIN on TV</button>
        </div>

        <div id="auth-step-2" style="display: none; margin-top: 15px; border-top: 1px dashed #444; padding-top: 15px;">
            <input type="text" id="pinCode" value="" data-i18n="pin_placeholder" placeholder="PIN" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            <button class="action-btn" data-i18n="btn_auth" style="background-color: #444;" onclick="pairTv()">2. Authenticate</button>
        </div>
    </div>

    <div class="card">
        <h3 data-i18n="sys_title">2. System</h3>
        <div class="grid-3">
            <button style="background-color: #d32f2f;" onclick="sendKey(1)">POWER</button>
            <button onclick="sendKey(47)">INPUT</button>
            <button onclick="sendKey(45)">INFO</button>
        </div>
        <div class="grid-3">
            <button onclick="sendKey(410)">AV MODE</button>
            <button onclick="sendKey(400)">3D</button>
            <button onclick="sendKey(26)">MUTE</button>
        </div>
    </div>

    <div class="card">
        <h3 data-i18n="nav_title">3. Navigation</h3>
        <div class="grid-3">
            <button onclick="sendKey(21)">HOME</button>
            <button onclick="sendKey(417)">MY APPS</button>
            <button onclick="sendKey(412)">EXIT</button>
        </div>
        <div class="vol-ch-container">
            <div class="column-btn">
                <button onclick="sendKey(24)">VOL +</button>
                <button onclick="sendKey(25)">VOL -</button>
            </div>
            <div class="column-btn">
                <button onclick="sendKey(27)">CH ▲</button>
                <button onclick="sendKey(28)">CH ▼</button>
            </div>
        </div>
        <div class="dpad">
            <div></div><button onclick="sendKey(12)">▲</button><div></div>
            <button onclick="sendKey(14)">◄</button>
            <button style="background-color: #555; font-size: 14px;" onclick="sendKey(20)">OK</button>
            <button onclick="sendKey(15)">►</button>
            <div></div><button onclick="sendKey(13)">▼</button><div></div>
        </div>
        <div class="grid-3" style="margin-bottom: 0;">
            <button data-i18n="btn_back" onclick="sendKey(23)">BACK</button>
            <button onclick="sendKey(22)">MENU</button>
            <button onclick="sendKey(169)">GUIDE</button>
        </div>
    </div>

    <div class="card">
        <h3 data-i18n="media_title">4. Media & Colors</h3>
        <div class="grid-4">
            <button onclick="sendKey(37)">◄◄</button>
            <button onclick="sendKey(33)">►</button>
            <button onclick="sendKey(34)">||</button>
            <button onclick="sendKey(36)">►►</button>
        </div>
        <button class="action-btn" style="background-color: #444;" onclick="sendKey(35)">■ STOP</button>

        <div class="grid-4" style="margin-top: 15px; margin-bottom: 0;">
            <button class="btn-red" onclick="sendKey(31)"></button>
            <button class="btn-green" onclick="sendKey(30)"></button>
            <button class="btn-yellow" onclick="sendKey(32)"></button>
            <button class="btn-blue" onclick="sendKey(29)"></button>
        </div>
    </div>

    <div class="card" style="border: 1px solid var(--accent-color);">
        <h3 data-i18n="tester_title">5. Discover Buttons</h3>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="customKeyCode" data-i18n="code_placeholder" placeholder="Code" style="margin-bottom: 0; width: 35%;" inputmode="numeric">
            <button class="action-btn" data-i18n="btn_test" style="margin-bottom: 0; flex: 1;" onclick="sendCustomKey()">Test on TV</button>
        </div>
    </div>
</div>

<div id="toast">Message here</div>
<button id="toggleDebug" onclick="toggleConsole()">Show Log</button>
<div id="debug-console"></div>

<script>
    const debugConsole = document.getElementById('debug-console');
    const toast = document.getElementById('toast');
    let toastTimeout;

    function hijackConsole(method, cssClass) {
        const original = console[method];
        console[method] = function(...args) {
            original.apply(console, args);
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
            const div = document.createElement('div');
            div.className = `log-entry ${cssClass}`;
            div.innerText = `[${new Date().toLocaleTimeString('pt-BR')}] ${msg}`;
            debugConsole.appendChild(div);
            debugConsole.scrollTop = debugConsole.scrollHeight;
        };
    }
    hijackConsole('log', ''); hijackConsole('warn', 'log-warn'); hijackConsole('error', 'log-error');

    function toggleConsole() {
        if (debugConsole.style.display === 'none' || debugConsole.style.display === '') {
            debugConsole.style.display = 'block';
            document.getElementById('toggleDebug').innerText = 'Hide Log';
            document.getElementById('toggleDebug').style.bottom = '150px';
        } else {
            debugConsole.style.display = 'none';
            document.getElementById('toggleDebug').innerText = 'Show Log';
            document.getElementById('toggleDebug').style.bottom = '10px';
        }
    }

    function showToast(message, type = 'normal') {
        clearTimeout(toastTimeout);
        toast.innerText = message;
        toast.className = `show ${type}`;
        toastTimeout = setTimeout(() => { toast.className = toast.className.replace('show', ''); }, 3000);
    }

    const translations = {
        "en": {
            "page_title": "LG Smart TV Remote",
            "conn_title": "1. Connection", "ip_placeholder": "TV Address", "pin_placeholder": "PIN",
            "btn_req_pin": "1. Request PIN on TV", "btn_auth": "2. Authenticate",
            "sys_title": "2. System", "nav_title": "3. Navigation", "btn_back": "BACK", 
            "media_title": "4. Media & Colors", "toast_auth_sent": "Auth command sent!", 
            "toast_req_pin": "Check TV for PIN", "toast_no_ip": "Please enter TV Address.",
            "toast_no_pin": "Please enter PIN.",
            "tester_title": "5. Discover Buttons", "code_placeholder": "Code", "btn_test": "Test on TV"
        },
        "pt": {
            "page_title": "LG Smart TV Remote",
            "conn_title": "1. Conexão", "ip_placeholder": "Endereço da TV", "pin_placeholder": "PIN",
            "btn_req_pin": "1. Solicitar PIN na TV", "btn_auth": "2. Autenticar",
            "sys_title": "2. Sistema", "nav_title": "3. Navegação", "btn_back": "VOLTAR", 
            "media_title": "4. Mídia e Cores", "toast_auth_sent": "Comando de autenticação enviado!", 
            "toast_req_pin": "Veja o PIN na tela da TV", "toast_no_ip": "Por favor, digite o endereço da TV.",
            "toast_no_pin": "Por favor, digite o PIN.",
            "tester_title": "5. Descobrir Botões", "code_placeholder": "Cód.", "btn_test": "Testar na TV"
        }
    };
    
    const currentLang = (navigator.language || navigator.userLanguage).toLowerCase().startsWith('pt') ? 'pt' : 'en';

    let pendingPinAddress = "";
    let pinTimeoutRef = null;
    const PIN_LIFESPAN_MS = 60000;

    window.addEventListener('DOMContentLoaded', () => {
        const dict = translations[currentLang];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (dict[key]) el.tagName === 'INPUT' ? el.placeholder = dict[key] : el.innerText = dict[key];
        });
        
        const savedIp = localStorage.getItem('tvIp');
        if (savedIp) {
            document.getElementById('tvIp').value = savedIp;
            console.log("Restored TV Address from storage:", savedIp);
        }
    });

    document.getElementById('tvIp').addEventListener('input', function() {
        const currentAddress = this.value.trim();
        const authStep2 = document.getElementById('auth-step-2');
        authStep2.style.display = (pendingPinAddress && currentAddress === pendingPinAddress) ? 'block' : 'none';
    });

    async function sendTVRequest(endpoint, xmlPayload) {
        const address = document.getElementById('tvIp').value.trim();
        if (!address) { showToast(translations[currentLang].toast_no_ip, 'error'); return false; }
        
        const parsedAddress = (address.includes(':') && !address.startsWith('[')) ? `[${address}]` : address;
        const url = `http://${parsedAddress}:8080/udap/api/${endpoint}`;
        
        console.log(`POST ${url}`);

        try {
            let statusCode, responseOk;
            
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorHttp) {
                const response = await window.Capacitor.Plugins.CapacitorHttp.post({
                    url: url,
                    headers: { 
                        'Content-Type': 'text/xml; charset=utf-8',
                        'User-Agent': 'UDAP/2.0'
                    },
                    data: xmlPayload
                });
                statusCode = response.status;
                responseOk = (statusCode >= 200 && statusCode < 300);
            } else {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/xml; charset=utf-8' },
                    body: xmlPayload,
                });
                statusCode = response.status;
                responseOk = response.ok;
            }

            if (responseOk) {
                console.log(`Success (HTTP ${statusCode})`);
                return true;
            } else {
                console.warn(`HTTP Error: ${statusCode}`);
                showToast(`Error ${statusCode}: TV rejected command`, 'error');
                
                if(statusCode === 401) {
                    pendingPinAddress = "";
                    document.getElementById('auth-step-2').style.display = 'none';
                }
                return false;
            }
        } catch (error) {
            console.error(`Connection failed: ${error.message}`);
            showToast(`Connection failed`, 'error');
            return false;
        }
    }

    async function requestPin() {
        const address = document.getElementById('tvIp').value.trim();
        if (!address) { showToast(translations[currentLang].toast_no_ip, 'error'); return; }
        
        localStorage.setItem('tvIp', address);
        
        const xml = `<?xml version="1.0" encoding="utf-8"?><envelope><api type="pairing"><name>showKey</name></api></envelope>`;
        const success = await sendTVRequest('pairing', xml);
        
        if (success) {
            pendingPinAddress = address;
            document.getElementById('auth-step-2').style.display = 'block';
            showToast(translations[currentLang].toast_req_pin, 'normal');
            
            if (pinTimeoutRef) clearTimeout(pinTimeoutRef);
            pinTimeoutRef = setTimeout(() => {
                pendingPinAddress = "";
                document.getElementById('auth-step-2').style.display = 'none';
                console.log("PIN window expired (60s).");
            }, PIN_LIFESPAN_MS);
        }
    }

    async function pairTv() {
        const pin = document.getElementById('pinCode').value.trim();
        if (!pin) { showToast(translations[currentLang].toast_no_pin, 'error'); return; }
        
        const xml = `<?xml version="1.0" encoding="utf-8"?><envelope><api type="pairing"><name>hello</name><value>${pin}</value><port>8080</port></api></envelope>`;
        const success = await sendTVRequest('pairing', xml);
        
        if (success) {
            showToast(translations[currentLang].toast_auth_sent, 'success');
            document.getElementById('pinCode').value = '';
            document.getElementById('auth-step-2').style.display = 'none';
            pendingPinAddress = ""; 
            if (pinTimeoutRef) clearTimeout(pinTimeoutRef);
        }
    }

    function sendKey(code) {
        const xml = `<?xml version="1.0" encoding="utf-8"?><envelope><api type="command"><name>HandleKeyInput</name><value>${code}</value></api></envelope>`;
        sendTVRequest('command', xml);
    }
    
    function sendCustomKey() {
        const code = document.getElementById('customKeyCode').value;
        if (code) sendKey(code);
    }
</script>

</body>
</html>
