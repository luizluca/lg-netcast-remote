<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">LG Smart TV Remote</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #a50034;
            --btn-bg: #2d2d2d;
            --text-color: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .card { background-color: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); }
        h3 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 16px; }

        input {
            width: calc(100% - 20px); padding: 10px; margin-bottom: 10px;
            border-radius: 6px; border: 1px solid #444; background-color: #000;
            color: #fff; font-size: 16px;
        }

        button {
            background-color: var(--btn-bg); color: var(--text-color); border: none;
            padding: 12px 5px; border-radius: 8px; font-size: 13px; font-weight: bold;
            cursor: pointer; transition: background-color 0.2s, transform 0.1s;
        }

        button:active { transform: scale(0.96); background-color: #444; }

        .action-btn { background-color: var(--accent-color); width: 100%; margin-bottom: 5px; padding: 12px; }
        .action-btn:active { background-color: #d32f2f; }

        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        
        .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .dpad button { height: 60px; font-size: 18px; }

        .vol-ch-container { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 15px; }
        .column-btn { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .column-btn button { height: 50px; font-size: 15px; }

        .btn-red { border-bottom: 4px solid #f44336; height: 40px; }
        .btn-green { border-bottom: 4px solid #4caf50; height: 40px; }
        .btn-yellow { border-bottom: 4px solid #ffeb3b; height: 40px; }
        .btn-blue { border-bottom: 4px solid #2196f3; height: 40px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. Connection -->
    <div class="card">
        <h3 data-i18n="conn_title">1. Connection</h3>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="tvIp" value="" data-i18n="ip_placeholder" placeholder="TV IP">
            <input type="text" id="pinCode" value="" data-i18n="pin_placeholder" placeholder="PIN">
        </div>
        <button class="action-btn" data-i18n="btn_auth" onclick="pairTv()">Authenticate on TV</button>
    </div>

    <!-- 2. System -->
    <div class="card">
        <h3 data-i18n="sys_title">2. System</h3>
        <div class="grid-3">
            <button style="background-color: #d32f2f;" onclick="sendKey(1)">POWER</button>
            <button onclick="sendKey(47)">INPUT</button>
            <button onclick="sendKey(45)">INFO</button>
        </div>
        <div class="grid-3">
            <button onclick="sendKey(410)">AV MODE</button>
            <button onclick="sendKey(400)">3D</button>
            <button onclick="sendKey(26)">MUTE</button>
        </div>
    </div>

    <!-- 3. Navigation -->
    <div class="card">
        <h3 data-i18n="nav_title">3. Navigation</h3>
        <div class="grid-3">
            <button onclick="sendKey(21)">HOME</button>
            <button onclick="sendKey(417)">MY APPS</button>
            <button onclick="sendKey(412)">EXIT</button>
        </div>

        <div class="vol-ch-container">
            <div class="column-btn">
                <button onclick="sendKey(24)">VOL +</button>
                <button onclick="sendKey(25)">VOL -</button>
            </div>
            <div class="column-btn">
                <button onclick="sendKey(27)">CH ▲</button>
                <button onclick="sendKey(28)">CH ▼</button>
            </div>
        </div>

        <div class="dpad">
            <div></div><button onclick="sendKey(12)">▲</button><div></div>
            <button onclick="sendKey(14)">◄</button>
            <button style="background-color: #555; font-size: 14px;" onclick="sendKey(20)">OK</button>
            <button onclick="sendKey(15)">►</button>
            <div></div><button onclick="sendKey(13)">▼</button><div></div>
        </div>
        
        <div class="grid-3" style="margin-bottom: 0;">
            <button data-i18n="btn_back" onclick="sendKey(23)">BACK</button>
            <button onclick="sendKey(22)">MENU</button>
            <button onclick="sendKey(169)">GUIDE</button>
        </div>
    </div>

    <!-- 4. Media & Colors -->
    <div class="card">
        <h3 data-i18n="media_title">4. Media & Colors</h3>
        <div class="grid-4">
            <button onclick="sendKey(37)">◄◄</button>
            <button onclick="sendKey(33)">►</button>
            <button onclick="sendKey(34)">||</button>
            <button onclick="sendKey(36)">►►</button>
        </div>
        <button class="action-btn" style="background-color: #444;" onclick="sendKey(35)">■ STOP</button>
        
        <div class="grid-4" style="margin-top: 15px; margin-bottom: 0;">
            <button class="btn-red" onclick="sendKey(31)"></button>
            <button class="btn-green" onclick="sendKey(30)"></button>
            <button class="btn-yellow" onclick="sendKey(32)"></button>
            <button class="btn-blue" onclick="sendKey(29)"></button>
        </div>
    </div>

    <!-- 5. Key Tester -->
    <div class="card" style="border: 1px solid var(--accent-color);">
        <h3 data-i18n="tester_title">5. Discover Buttons</h3>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="customKeyCode" data-i18n="code_placeholder" placeholder="Code" style="margin-bottom: 0; width: 30%;">
            <button class="action-btn" data-i18n="btn_test" style="margin-bottom: 0; flex: 1;" onclick="sendCustomKey()">Test on TV</button>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // 🌍 TRANSLATION DICTIONARY (i18n)
    // To add a new language, just copy one of the blocks below and translate.
    // =========================================================================
    const translations = {
        "en": {
            "page_title": "LG Smart TV Remote Pro",
            "conn_title": "1. Connection",
            "ip_placeholder": "TV IP",
            "pin_placeholder": "PIN",
            "btn_auth": "Authenticate on TV",
            "sys_title": "2. System",
            "nav_title": "3. Navigation",
            "btn_back": "BACK",
            "media_title": "4. Media & Colors",
            "tester_title": "5. Discover Buttons",
            "code_placeholder": "Code",
            "btn_test": "Test on TV",
            "alert_auth": "Authentication request sent!"
        },
        "pt": {
            "page_title": "Controle LG Smart TV Pro",
            "conn_title": "1. Conexão",
            "ip_placeholder": "IP da TV",
            "pin_placeholder": "PIN",
            "btn_auth": "Autenticar na TV",
            "sys_title": "2. Sistema",
            "nav_title": "3. Navegação",
            "btn_back": "VOLTAR",
            "media_title": "4. Mídia e Cores",
            "tester_title": "5. Descobrir Botões",
            "code_placeholder": "Cód.",
            "btn_test": "Testar na TV",
            "alert_auth": "Autenticação enviada!"
        }
    };

    // Auto-detect language (Defaults to 'en' if not 'pt')
    const userLang = navigator.language || navigator.userLanguage;
    const currentLang = userLang.toLowerCase().startsWith('pt') ? 'pt' : 'en';

    // Apply translations on page load
    function applyLanguage() {
        document.documentElement.lang = currentLang;
        const dict = translations[currentLang];
        
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (dict[key]) {
                if (el.tagName === 'INPUT') {
                    el.placeholder = dict[key];
                } else {
                    el.innerText = dict[key];
                }
            }
        });
    }
    
    // Execute on load
    window.addEventListener('DOMContentLoaded', applyLanguage);

    // =========================================================================
    // CORE NETWORK FUNCTIONS
    // =========================================================================
    async function sendTVRequest(endpoint, xmlPayload) {
        const ip = document.getElementById('tvIp').value.trim();
        if (!ip) return;
        
        const url = `http://${ip}:8080/udap/api/${endpoint}`;
        try {
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'text/xml; charset=utf-8' },
                body: xmlPayload
            });
        } catch (error) {
            console.error('Connection error:', error);
        }
    }

    function pairTv() {
        const pin = document.getElementById('pinCode').value.trim();
        const xml = `<?xml version="1.0" encoding="utf-8"?><envelope><api type="pairing"><name>hello</name><value>${pin}</value><port>8080</port></api></envelope>`;
        sendTVRequest('pairing', xml);
        
        // Alert translated
        alert(translations[currentLang].alert_auth);
    }

    function sendKey(code) {
        console.log(`Sending Key Code: ${code}`);
        const xml = `<?xml version="1.0" encoding="utf-8"?><envelope><api type="command"><name>HandleKeyInput</name><value>${code}</value></api></envelope>`;
        sendTVRequest('command', xml);
    }

    function sendCustomKey() {
        const code = document.getElementById('customKeyCode').value;
        if (code) sendKey(code);
    }
</script>

</body>
</html>
